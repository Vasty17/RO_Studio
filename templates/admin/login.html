<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Acceso Administrativo — Ro Studio</title>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a10] text-[#e4e1e9] min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-[#13131c] border border-white/10 rounded-3xl p-8 shadow-2xl relative">
    <div class="text-center mb-8">
      <div class="w-14 h-14 rounded-full bg-black ring-2 ring-[#d4bbff]/40 flex items-center justify-center mx-auto mb-4">
        <span class="text-[#d4bbff] font-bold text-xl">RO</span>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Acceso Administrativo</h1>
      <p class="text-xs text-neutral-400 mt-1">Ingresa tus credenciales de staff para gestionar el atelier.</p>
    </div>

    {% if error %}
    <div class="mb-6 p-3.5 rounded-xl bg-red-950/60 border border-red-500/40 text-red-300 text-xs text-center">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="{% url 'admin_login' %}" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-xs font-semibold text-neutral-300 mb-1">Usuario</label>
        <input type="text" name="username" class="w-full bg-[#1b1b24] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#d4bbff]" placeholder="admin" required autofocus>
      </div>

      <div>
        <label class="block text-xs font-semibold text-neutral-300 mb-1">Contraseña</label>
        <input type="password" name="password" class="w-full bg-[#1b1b24] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-[#d4bbff]" placeholder="••••••••" required>
      </div>

      <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-[#b388ff] to-[#d4bbff] text-[#260058] font-bold rounded-xl text-xs uppercase tracking-wider hover:opacity-95 transition-opacity mt-2">
        Iniciar Sesión
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-white/5 text-center">
      <a href="{% url 'inicio' %}" class="text-xs text-neutral-500 hover:text-[#d4bbff]">← Volver al sitio público</a>
    </div>
  </div>
</body>
</html>
